version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      prometheus:
        patterns:
          - "github.com/prometheus/*"
      qiniu:
        patterns:
          - "github.com/qiniu/*"
      golang-x:
        patterns:
          - "golang.org/x/*"
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: docker
