name: govulncheck

on:
  pull_request:
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - .github/workflows/govulncheck.yml
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - go.mod
      - go.sum
      - .github/workflows/govulncheck.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: govulncheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: Scan Go dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          cache-dependency-path: go.sum
          go-package: ./...
          output-format: text
