{{- if not .Values.config.existingSecret.name }}
{{- $enabled := or .Values.config.generated.kodo.enabled .Values.config.generated.cdn.enabled .Values.config.generated.billing.enabled }}
{{- if not $enabled }}
{{- fail "at least one of config.generated.kodo.enabled, config.generated.cdn.enabled, or config.generated.billing.enabled must be true when config.existingSecret.name is empty" }}
{{- end }}
{{- $credentialNames := dict }}
{{- range .Values.credentials }}
{{- if hasKey $credentialNames .name }}
{{- fail (printf "credentials contains duplicate name %q" .name) }}
{{- end }}
{{- $_ := set $credentialNames .name true }}
{{- end }}
{{- if and .Values.config.generated.kodo.enabled (not (hasKey $credentialNames .Values.config.generated.kodo.credential)) }}
{{- fail (printf "config.generated.kodo.credential %q is not defined in credentials" .Values.config.generated.kodo.credential) }}
{{- end }}
{{- if and .Values.config.generated.cdn.enabled (not (hasKey $credentialNames .Values.config.generated.cdn.credential)) }}
{{- fail (printf "config.generated.cdn.credential %q is not defined in credentials" .Values.config.generated.cdn.credential) }}
{{- end }}
{{- if and .Values.config.generated.billing.enabled (not (hasKey $credentialNames .Values.config.generated.billing.credential)) }}
{{- fail (printf "config.generated.billing.credential %q is not defined in credentials" .Values.config.generated.billing.credential) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qiniu-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qiniu-exporter.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  config.yaml: |
    server:
      listen: {{ printf ":%d" (int .Values.exporter.port) | quote }}

    credentials:
      {{- range $index, $credential := .Values.credentials }}
      {{ $credential.name | quote }}:
        access_key_file: {{ printf "/var/run/secrets/qiniu/%d/access-key" $index | quote }}
        secret_key_file: {{ printf "/var/run/secrets/qiniu/%d/secret-key" $index | quote }}
      {{- end }}

    kodo:
      enabled: {{ .Values.config.generated.kodo.enabled }}
      credential: {{ .Values.config.generated.kodo.credential | quote }}
      statistics_timezone_verified: {{ .Values.config.generated.kodo.statisticsTimezoneVerified }}
      {{- with .Values.config.generated.kodo.storageClasses }}
      storage_classes:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- else }}
      storage_classes: []
      {{- end }}

    cdn:
      enabled: {{ .Values.config.generated.cdn.enabled }}
      credential: {{ .Values.config.generated.cdn.credential | quote }}
      statistics_timezone_verified: {{ .Values.config.generated.cdn.statisticsTimezoneVerified }}
      monitoring_units_verified: {{ .Values.config.generated.cdn.monitoringUnitsVerified }}

    billing:
      enabled: {{ .Values.config.generated.billing.enabled }}
      credential: {{ .Values.config.generated.billing.credential | quote }}
      timezone: {{ .Values.config.generated.billing.timezone | quote }}
      {{- with .Values.config.generated.billing.resourcePackAllowlist }}
      resource_pack_allowlist:
        {{- range . }}
        - item: {{ .item | quote }}
          zone: {{ .zone | quote }}
          available_time: {{ .availableTime | quote }}
          unit: {{ .unit | quote }}
        {{- end }}
      {{- else }}
      resource_pack_allowlist: []
      {{- end }}

    collection:
      source_lag: {{ .Values.config.generated.collection.sourceLag | quote }}
      intervals:
        discovery: {{ .Values.config.generated.collection.intervals.discovery | quote }}
        kodo_capacity: {{ .Values.config.generated.collection.intervals.kodoCapacity | quote }}
        kodo_activity: {{ .Values.config.generated.collection.intervals.kodoActivity | quote }}
        cdn_monitoring: {{ .Values.config.generated.collection.intervals.cdnMonitoring | quote }}
        cdn_analytics: {{ .Values.config.generated.collection.intervals.cdnAnalytics | quote }}
      stale_after:
        realtime: {{ .Values.config.generated.collection.staleAfter.realtime | quote }}
        billing_balance: {{ .Values.config.generated.collection.staleAfter.billingBalance | quote }}
        billing_daily: {{ .Values.config.generated.collection.staleAfter.billingDaily | quote }}
        billing_finalized: {{ .Values.config.generated.collection.staleAfter.billingFinalized | quote }}
      kodo_max_qps: {{ .Values.config.generated.collection.kodoMaxQPS }}
      cdn_fusion_max_qps: {{ .Values.config.generated.collection.cdnFusionMaxQPS }}
      qiniu_api_host_max_qps: {{ .Values.config.generated.collection.qiniuAPIHostMaxQPS }}
      billing_max_qps: {{ .Values.config.generated.collection.billingMaxQPS }}
      limiter_burst: {{ .Values.config.generated.collection.limiterBurst }}
      first_request_utilization: {{ .Values.config.generated.collection.firstRequestUtilization }}
      kodo_max_concurrency: {{ .Values.config.generated.collection.kodoMaxConcurrency }}
      cdn_max_concurrency: {{ .Values.config.generated.collection.cdnMaxConcurrency }}
      billing_max_concurrency: {{ .Values.config.generated.collection.billingMaxConcurrency }}
{{- end }}
