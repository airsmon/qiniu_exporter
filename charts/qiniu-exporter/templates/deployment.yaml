{{- $deploymentAnnotations := mergeOverwrite (dict) .Values.commonAnnotations .Values.deploymentAnnotations }}
{{- $podLabels := mergeOverwrite (dict) .Values.commonLabels .Values.podLabels (include "qiniu-exporter.selectorLabels" . | fromYaml) (dict "app.kubernetes.io/component" "exporter") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qiniu-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qiniu-exporter.labels" . | nindent 4 }}
  {{- with $deploymentAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "qiniu-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- toYaml $podLabels | nindent 8 }}
      {{- if or (not .Values.config.existingSecret.name) .Values.podAnnotations }}
      annotations:
        {{- if not .Values.config.existingSecret.name }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "qiniu-exporter.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      containers:
        - name: qiniu-exporter
          image: {{ include "qiniu-exporter.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --config.file=/etc/qiniu-exporter/config.yaml
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.exporter.port }}
              protocol: TCP
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            successThreshold: {{ .Values.startupProbe.successThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.readinessProbe.successThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.livenessProbe.successThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/qiniu-exporter
              readOnly: true
            {{- range $index, $credential := .Values.credentials }}
            {{- if $credential.existingSecret.name }}
            - name: {{ printf "credential-%d" $index }}
              mountPath: {{ printf "/var/run/secrets/qiniu/%d" $index }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          {{- if .Values.config.existingSecret.name }}
          secret:
            secretName: {{ include "qiniu-exporter.configName" . }}
            defaultMode: 0440
            items:
              - key: {{ .Values.config.existingSecret.key }}
                path: config.yaml
          {{- else }}
          configMap:
            name: {{ include "qiniu-exporter.configName" . }}
            items:
              - key: config.yaml
                path: config.yaml
          {{- end }}
        {{- range $index, $credential := .Values.credentials }}
        {{- if $credential.existingSecret.name }}
        - name: {{ printf "credential-%d" $index }}
          secret:
            secretName: {{ $credential.existingSecret.name }}
            defaultMode: 0440
            items:
              - key: {{ $credential.existingSecret.accessKeyKey }}
                path: access-key
              - key: {{ $credential.existingSecret.secretKeyKey }}
                path: secret-key
        {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
