server:
  listen: ":9106"

credentials:
  main:
    access_key_env: QINIU_ACCESS_KEY
    secret_key_env: QINIU_SECRET_KEY

kodo:
  enabled: true
  credential: main
  # Buckets and regions are discovered automatically through read-only APIs.
  # Keep false until request/response time semantics match the console.
  statistics_timezone_verified: false
  storage_classes:
    - standard
    - ia
    - archive_ir
    - archive
    - deep_archive
    - intelligent_tiering

cdn:
  enabled: true
  credential: main
  # Active domains are discovered automatically through a read-only API.
  # Keep false until timestamps match the console in Asia/Shanghai.
  statistics_timezone_verified: false
  # Set true only after comparing monitoring bandwidth/flow with the console.
  monitoring_units_verified: false

billing:
  enabled: true
  credential: main
  timezone: Asia/Shanghai
  # Exact account-specific tuples only. Leave empty to disable this collector.
  resource_pack_allowlist: []
  # resource_pack_allowlist:
  #   - item: exact-item-name-from-console
  #     zone: exact-zone-name-from-console
  #     available_time: exact-availability-name-from-console
  #     unit: GB

collection:
  source_lag: 10m
  # Discovery is independent from business-statistics collection. Prometheus
  # may continue scraping /metrics every 30s without increasing Qiniu API use.
  intervals:
    discovery: 1h
    kodo_capacity: 30m
    kodo_activity: 30m
    cdn_monitoring: 30m
    cdn_analytics: 30m
  stale_after:
    realtime: 1h
    billing_balance: 3h
    billing_daily: 36h
    billing_finalized: 40d
  kodo_max_qps: 1
  cdn_fusion_max_qps: 5
  qiniu_api_host_max_qps: 10
  billing_max_qps: 1
  limiter_burst: 1
  first_request_utilization: 0.8
  kodo_max_concurrency: 1
  cdn_max_concurrency: 4
  billing_max_concurrency: 1
